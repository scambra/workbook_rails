# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4', '4.0']
        rails: ['7.2', '8.0', '8.1']
    env:
      BUNDLE_GEMFILE: gemfiles/Gemfile-${{ matrix.rails }}
      RAILS_ENV: test
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        rubygems: latest
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Setup DB
      run: >-
        cd spec/dummy &&
        BUNDLE_GEMFILE=../../$BUNDLE_GEMFILE bundle exec rake db:create &&
        BUNDLE_GEMFILE=../../$BUNDLE_GEMFILE bundle exec rake db:migrate &&
        cd ../..
    - name: Run tests
      run: bundle exec rake
    - name: Save coverage report
      if: ${{ !cancelled() && hashFiles('coverage/coverage.json') != '' }}
      uses: actions/upload-artifact@v7.0.2
      with:
        name: coverage-ruby-${{ matrix.ruby }}-rails-${{ matrix.rails }}
        path: coverage/coverage.json
        if-no-files-found: error
        retention-days: 1

  coverage:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Download coverage reports
      uses: actions/download-artifact@v8.0.2
      with:
        pattern: coverage-*
        path: coverage
    - name: Report coverage to Qlty
      if: ${{ hashFiles('coverage/**/coverage.json') != '' }}
      uses: qltysh/qlty-action/coverage@v2
      with:
        oidc: true
        files: coverage/**/coverage.json
        format: simplecov
        skip-errors: false
